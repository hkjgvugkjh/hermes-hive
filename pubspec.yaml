name: hermes_hive
description: "Connect to multiple Hermes Web UI servers and manage them all in one place."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_markdown: ^0.7.4
  uuid: ^4.5.1
  intl: ^0.20.2
  cryptography: ^2.7.0
  web_socket_channel: ^3.0.1
  hermes_shared:
    path: ../hermes-shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
